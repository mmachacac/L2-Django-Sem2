<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Operaciones matemáticas</title>
</head>
<body>
    <h2>Operaciones matemáticas</h2>

    <form action="{% url 'encuesta:resultado_operacion' %}" method="post">
        {% csrf_token %}

        <p>
            <label for="valor1">Primer valor:</label>
            <input type="number" id="valor1" name="valor1" step="any" required>
        </p>

        <p>
            <label for="valor2">Segundo valor:</label>
            <input type="number" id="valor2" name="valor2" step="any" required>
        </p>

        <p>
            <label for="operacion">Operación:</label>
            <select id="operacion" name="operacion">
                <option value="suma">Suma</option>
                <option value="resta">Resta</option>
                <option value="multiplicacion">Multiplicación</option>
            </select>
        </p>

        <button type="submit">Calcular</button>
    </form>
</body>
</html>
