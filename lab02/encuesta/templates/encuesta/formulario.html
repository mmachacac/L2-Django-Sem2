<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>{{ titulo }}</title>
</head>
<body>
    <h2>{{ titulo }}</h2>

    <form action="{% url 'encuesta:enviar' %}" method="post">
        {% csrf_token %}

        <p>
            <label for="nombre">Nombre:</label>
            <input type="text" id="nombre" name="nombre" maxlength="50">
        </p>

        <p>
            <label for="password">Contraseña:</label>
            <input type="password" id="password" name="password">
        </p>

        <p>
            <label for="educacion">Educación:</label>
            <select id="educacion" name="educacion">
                <option value="sin-estudios">Sin estudios</option>
                <option value="educacion-obligatoria" selected>Educación obligatoria</option>
                <option value="formacion-profesional">Formación profesional</option>
                <option value="universidad">Universidad</option>
            </select>
        </p>

        <fieldset>
            <legend>Nacionalidad:</legend>
            <input type="radio" id="nacionalidad-hispana" name="nacionalidad" value="hispana">
            <label for="nacionalidad-hispana">Hispana</label>
            <input type="radio" id="nacionalidad-otra" name="nacionalidad" value="otra">
            <label for="nacionalidad-otra">Otra</label>
        </fieldset>

        <fieldset>
            <legend>Idiomas:</legend>
            <input type="checkbox" id="idioma-espanol" name="idiomas" value="español" checked>
            <label for="idioma-espanol">Español</label>
            <input type="checkbox" id="idioma-ingles" name="idiomas" value="inglés">
            <label for="idioma-ingles">Inglés</label>
            <input type="checkbox" id="idioma-frances" name="idiomas" value="francés">
            <label for="idioma-frances">Francés</label>
            <input type="checkbox" id="idioma-aleman" name="idiomas" value="aleman">
            <label for="idioma-aleman">Alemán</label>
        </fieldset>

        <p>
            <label for="email">Email:</label>
            <input type="text" id="email" name="email">
        </p>

        <p>
            <label for="sitioweb">Sitio web:</label>
            <input type="text" id="sitioweb" name="sitioweb">
        </p>

        <button type="submit">Enviar</button>
    </form>
</body>
</html>
